  <text x="840" y="141" text-anchor="middle" font-size="15">⚡️</text>
  <text x="840" y="170" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">Efficiency Gains</text>

