  <text x="840" y="337" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffa116">Deterministic CI</text>
  <text x="840" y="355" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">Automated verification</text>
